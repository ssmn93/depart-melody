          <script>
        const audio = document.getElementById("melody");
        const approach = document.getElementById("approach");

        let isPlaying = false;

        // クリックイベント
        document.getElementById('approach').addEventListener('click', function() {
              if (!isPlaying) {
                isPlaying = true;
                approach.src = "https://raw.githubusercontent.com/ssmn93/depart-melody/main/approach/甲子園_1番_接近中.gif";
                audio.play();
              } else {
                isPlaying = false;
                approach.src = "https://raw.githubusercontent.com/ssmn93/depart-melody/main/approach/甲子園_1番_到着前.gif";
                audio.pause();
                audio.currentTime = 0;
              }
        });
    </script>
